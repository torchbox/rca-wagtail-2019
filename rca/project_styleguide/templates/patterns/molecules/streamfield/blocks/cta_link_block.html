{% load wagtailcore_tags %}

{% if value.page %}
    <a class="link link--primary link--link link--block" href="{{ value.get_url }}">
        <span class="link__label link__label--tight">
            {{ value.get_title }}
        </span>
        <svg class="link__icon" width="12" height="8" aria-hidden="true"><use xlink:href="#arrow"></use></svg>
    </a>
{% else %}
    <a class="link link--primary link--link link--external link--block" href="{{ value.get_url }}" target="_blank">
        <span class="link__label link__label--tight">
            {{ value.get_title }}
        </span>
        <svg class="link__icon" width="12" height="8" aria-hidden="true"><use xlink:href="#arrow-external"></use></svg>
    </a>
{% endif %}
