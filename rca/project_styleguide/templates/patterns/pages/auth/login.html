{% extends "wagtailadmin/login.html" %}

{% block below_login %}
    {# social:begin is POST-only (social-auth-app-django 6), and forms can't nest #}
    <form action="{% url "social:begin" "azuread-tenant-oauth2" %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}">
        <footer class="form-actions">
            <button type="submit" class="button">Sign in with single sign-on</button>
        </footer>
    </form>
{% endblock %}
