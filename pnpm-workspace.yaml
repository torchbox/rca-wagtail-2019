publicHoistPattern:
  - '*biome*'
  - '*prettier*'
  - '*stylelint*'
  - '@babel/*'
allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
  esbuild: false
  core-js: false
blockExoticSubdeps: true
trustPolicy: no-downgrade
minimumReleaseAge: 4320
# Trivy scan R1-403 (PR #1208, 2026-11-24) flagged 4 MEDIUM findings in glob
# and minimatch nested under jest and babel-plugin-istanbul. These overrides
# force every copy to a cool-down-allowed release. Re-evaluate once jest and
# babel-plugin-istanbul bump their own nested copies past these versions.
overrides:
  glob@<14.0.6: 14.0.6
  test-exclude>minimatch: 11.0.9
