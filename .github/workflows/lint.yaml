name: lint

on: workflow_call

jobs:
  lint-front-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack and prepare pnpm
        # Node 25+ ships no corepack, so install the resolved corepack release
        # first, then let it activate the pnpm release package.json pins.
        run: |
          npm install -g corepack@0.36.0
          corepack enable pnpm
          corepack prepare pnpm@12.22.0+sha512.894940a3d9a57dfa6fd373990fb4e41e09c2f2d76d982ed1d75275d39267f988fb4e2d40900cbe9921c68d97c67aa1a1096d276633db248f7b34927ac9ddb7a4 --activate
      - name: Install pnpm dependencies
        run: pnpm install
      - name: CSS linting
        run: pnpm run lint:css
      - name: JS linting
        run: pnpm run lint:js
      - name: Prettier
        run: pnpm run format
      - name: JS tests
        run: pnpm run test

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.15
      - uses: Gr1N/setup-poetry@v8
        with:
          poetry-version: 1.8.5
      - name: Install Poetry
        run: |
          poetry config virtualenvs.create false &&
          poetry install
      - name: Flake8
        run: flake8 ./rca fabfile.py
      - name: isort
        run: isort --check-only --diff ./rca --skip-glob '**/migrations/*'
      - name: black
        run: black --check --diff ./rca fabfile.py --exclude migrations/
