name: lint

on: workflow_call

jobs:
  lint-front-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack and prepare pnpm
        # Node 25+ ships no corepack, so install the resolved corepack release
        # first, then let it activate the pnpm release package.json pins (with
        # no version given, `corepack prepare` reads the pin from package.json's
        # "packageManager" field).
        run: |
          npm install -g corepack@0.36.0
          corepack enable pnpm
          corepack prepare --activate
      - name: Install pnpm dependencies
        run: pnpm install
      - name: CSS linting
        run: pnpm run lint:css
      - name: JS linting
        run: pnpm run lint:js
      - name: Prettier
        run: pnpm run format
      - name: JS tests
        run: pnpm run test

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.15
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          # Keep in sync with: the UV_VERSION ARG in Dockerfile, and the
          # astral-sh/uv-pre-commit rev in .pre-commit-config.yaml.
          version: '0.13.9'
      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Ruff check
        run: ruff check ./rca fabfile.py
      - name: Ruff format
        run: ruff format --check --diff ./rca fabfile.py
