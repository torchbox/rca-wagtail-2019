name: test

on: workflow_call

jobs:
  python-tests:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: rca.settings.test
      SECRET_KEY: testingsecretkey
      SECURE_SSL_REDIRECT: false
      ALLOWED_HOSTS: localhost
      DATABASE_URL: postgres://postgres:postgres@localhost/postgres
      BIRDBATH_REQUIRED: false

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.15
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          # Keep in sync with: the UV_VERSION ARG in Dockerfile, and the
          # astral-sh/uv-pre-commit rev in .pre-commit-config.yaml.
          version: '0.13.9'
      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack and prepare pnpm
        # Node 25+ ships no corepack, so install the resolved corepack release
        # first, then let it activate the pnpm release package.json pins (with
        # no version given, `corepack prepare` reads the pin from package.json's
        # "packageManager" field).
        run: |
          npm install -g corepack@0.36.0
          corepack enable pnpm
          corepack prepare --activate
      - name: Install pnpm dependencies
        run: pnpm install
      - name: Compile static files
        run: pnpm run build:prod
      - name: collectstatic
        run: python manage.py collectstatic --verbosity 0 --noinput --clear
      - name: System checks
        run: python manage.py check
      - name: Missing migrations
        run: python manage.py makemigrations --check --noinput
      - name: Test and Coverage
        run: |
          coverage run ./manage.py test --settings=rca.settings.test
          coverage report
          coverage xml
          bash <(curl -s https://codecov.io/bash) -t $COVERAGE_TOKEN
