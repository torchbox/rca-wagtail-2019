default_language_version:
  node: system
  python: python3.15
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.17.6'
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: fix:js
        name: fix:js
        language: system
        entry: pnpm run fix:js
        # fix:js runs `biome check --write .`, which globs the whole project via
        # Biome's own file discovery, so passing per-file paths is redundant — use the
        # hook's file filter only to decide *whether* to run.
        pass_filenames: false
        types_or:
          - javascript
          - ts
          - tsx
          - json
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.10.1
    hooks:
      - id: prettier
        types_or: [markdown, css, scss, yaml]
  - repo: https://github.com/awebdeveloper/pre-commit-stylelint
    rev: 0.0.2
    hooks:
      - id: stylelint
        additional_dependencies:
          - stylelint@17.16.0
          - stylelint-config-torchbox@5.0.0
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.33.0
    hooks:
      - id: django-upgrade
        args: [--target-version, '5.2'] # Replace with Django version
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: '0.13.9' # keep version in sync with UV_VERSION ARG in Dockerfile
    hooks:
      - id: uv-lock
        args: ['--locked']
        files: ^pyproject\.toml$
