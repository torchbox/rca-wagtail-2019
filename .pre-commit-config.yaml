default_language_version:
  node: system
  python: python3.15
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.17.6'
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-eslint
    # Held below v9: eslint-config-torchbox@^1.1.0 has no ESLint v9 flat-config support.
    # The actual eslint version is pinned via additional_dependencies (eslint@8.57.1).
    rev: v10.15.0
    hooks:
      - id: eslint
        additional_dependencies:
          - eslint@8.57.1
          - eslint-config-airbnb@19.0.4
          - eslint-config-prettier@8.10.2
          - eslint-config-torchbox@1.1.0
          - eslint-plugin-import@2.32.0
          - eslint-plugin-jsx-a11y@6.10.2
          - eslint-plugin-react@7.37.5
          - eslint-plugin-react-hooks@4.6.2
          - '@babel/core@7.29.13'
          - '@babel/preset-env@7.29.14'
          - '@babel/preset-react@7.29.7'
          - '@babel/eslint-parser@7.29.13'
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.10.1
    hooks:
      - id: prettier
        types_or: [markdown, css, scss, javascript, json, yaml]
  - repo: https://github.com/awebdeveloper/pre-commit-stylelint
    rev: 0.0.2
    hooks:
      - id: stylelint
        additional_dependencies:
          - stylelint@17.16.0
          - stylelint-config-torchbox@5.0.0
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.33.0
    hooks:
      - id: django-upgrade
        args: [--target-version, '5.2'] # Replace with Django version
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: '0.13.9' # keep version in sync with UV_VERSION ARG in Dockerfile
    hooks:
      - id: uv-lock
        args: ['--locked']
        files: ^pyproject\.toml$
