default_language_version:
  node: system
  python: python3.15
repos:
  - repo: https://github.com/python/black
    rev: 26.10.1
    hooks:
      - id: black
        # Migrations are intentionally left unformatted; CI excludes them too
        exclude: '(^|/)migrations/'
  - repo: https://github.com/PyCQA/isort
    rev: '9.0.2'
    hooks:
      - id: isort
        # Migrations are intentionally left unformatted; CI excludes them too
        exclude: '(^|/)migrations/'
  - repo: https://github.com/pycqa/flake8
    # flake8 config is in setup.cfg
    rev: 7.5.0
    hooks:
      - id: flake8
  - repo: local
    hooks:
      - id: fix:js
        name: fix:js
        language: system
        entry: pnpm run fix:js
        # fix:js runs `biome check --write .`, which globs the whole project via
        # Biome's own file discovery, so passing per-file paths is redundant — use the
        # hook's file filter only to decide *whether* to run.
        pass_filenames: false
        types_or:
          - javascript
          - ts
          - tsx
          - json
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.10.1
    hooks:
      - id: prettier
        types_or: [markdown, css, scss, yaml]
  - repo: https://github.com/awebdeveloper/pre-commit-stylelint
    rev: 0.0.2
    hooks:
      - id: stylelint
        additional_dependencies:
          - stylelint@17.16.0
          - stylelint-config-torchbox@5.0.0
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.33.0
    hooks:
      - id: django-upgrade
        args: [--target-version, '5.2'] # Replace with Django version
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
  - repo: https://github.com/python-poetry/poetry
    rev: '1.8.5' # keep version in sync with version installed in the Dockerfile
    hooks:
      - id: poetry-check
      - id: poetry-lock
        # Never update dependencies and only run on changes to pyproject.toml
        args: [--no-update]
        files: ^pyproject.toml$
